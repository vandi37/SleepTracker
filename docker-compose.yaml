services:
  frontend:
    build: ./frontend
    ports:
      - "${FRONTEND_PORT:-80}:80"
    depends_on:
      - app

  app:
    build: .
    expose:
      - "8080"
    depends_on:
      db:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully 

    environment:
      PORT: ${PORT:-8080}
      REFRESH_SECRET: ${REFRESH_SECRET}
      REFRESH_EXP: ${REFRESH_EXP:-720h}
      ACCESS_SECRET: ${ACCESS_SECRET}
      ACCESS_EXP: ${ACCESS_EXP:-24h}
      CONN_STRING: postgresql://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD:-12345}@db:5432/tracker?sslmode=disable  
    volumes:
      - ${LOG_PATH:-./logs}:/logs  

  migrations:
    build:
      context: ./migrations
      dockerfile: Dockerfile
    command: goose -dir /migrations postgres "postgresql://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD:-12345}@db:5432/tracker?sslmode=disable" up
    healthcheck:
      test: ["CMD-SHELL", "goose -dir /migrations postgres \"$$CONN_STRING\" status | grep -q 'Pending' && exit 1 || exit 0"]
      interval: 10s
      timeout: 5s
      retries: 3
    depends_on:
      db:
        condition: service_healthy
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-12345}

  db:
    image: postgres:latest
    restart: always
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-app} -d tracker"]
      interval: 30s
      timeout: 60s
      retries: 5
      start_period: 80s
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-12345}
      POSTGRES_DB: tracker